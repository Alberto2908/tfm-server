spring.application.name=tfm.vulnerabilidades

spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Cookie de sesion (JSESSIONID): el frontend y el backend viven en dominios
# distintos (Vercel/Render), asi que el navegador solo reenvia la cookie en
# peticiones cross-site si lleva SameSite=None, y SameSite=None exige Secure.
# En local (http://localhost) se deja en Lax/no-secure para que funcione sin
# HTTPS; en despliegue hay que definir SESSION_COOKIE_SAME_SITE=none y
# SESSION_COOKIE_SECURE=true.
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Keep-alive: el plan gratuito de Render duerme la instancia a los ~15 min sin
# trafico, asi que el propio servidor se hace ping a /health cada 14 min. En
# despliegue hay que definir APP_BASE_URL con la URL publica (https://...);
# en local se puede silenciar con KEEPALIVE_ENABLED=false.
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.keepalive.enabled=${KEEPALIVE_ENABLED:true}
app.keepalive.rate-ms=${KEEPALIVE_RATE_MS:840000}

# El ciclo del agente puede tardar minutos: con un solo hilo de scheduling
# bloquearia los pings de keep-alive mientras se ejecuta.
spring.task.scheduling.pool.size=2

# Agentes de IA (descubrimiento y verificacion automatica de vulnerabilidades)
# Desactivados por defecto: para activarlos, definir ANTHROPIC_API_KEY como variable de entorno
# y AGENTS_ENABLED=true (nunca poner la key directamente en este fichero).
agents.enabled=${AGENTS_ENABLED:false}
agents.cycle.initial-delay=${AGENTS_INITIAL_DELAY:PT1M}
agents.cycle.interval=${AGENTS_CYCLE_INTERVAL:PT48H}
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5}

# Subida de informes/documentacion para el agente (POST /api/agent/ingest-document)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Importador de CVEs reales (NVD) - tarea puntual, desactivada por defecto.
# Se autolimita por espacio estimado (import.cve.budget-mb) para no agotar el
# almacenamiento de MongoDB, y guarda progreso para poder reanudar despues.
import.cve.enabled=${IMPORT_CVE_ENABLED:false}
import.cve.budget-mb=${IMPORT_CVE_BUDGET_MB:350}
nvd.api.key=${NVD_API_KEY:}

# Actualizacion puntual de impact/mitigation de CVE ya importados (re-barrido
# de NVD, sin volver a insertar). Desactivada por defecto.
update.cve.enabled=${UPDATE_CVE_ENABLED:false}

# Backfill puntual de createdAt/verifiedAt de CVE ya importados (corrige el bug
# de CveMapper.publishedDate() que dejaba todas las fechas como la de importacion
# en vez de la fecha real de publicacion del CVE). Desactivado por defecto.
backfill.dates.enabled=${BACKFILL_DATES_ENABLED:false}
